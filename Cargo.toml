[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/KwentiN-ui/prepolix"

[workspace.dependencies]
plx-core = { path = "crates/plx-core" }
plx-mesh = { path = "crates/plx-mesh" }
plx-model = { path = "crates/plx-model" }
plx-io = { path = "crates/plx-io" }
plx-results = { path = "crates/plx-results" }
plx-mesher = { path = "crates/plx-mesher" }
plx-job = { path = "crates/plx-job" }
plx-render = { path = "crates/plx-render" }

bytemuck = { version = "1.25", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.36"
egui-wgpu = "0.36"
egui_dock = "0.21"
env_logger = "0.11"
glam = { version = "0.34", features = ["bytemuck"] }
log = "0.4"
rfd = "0.17"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
