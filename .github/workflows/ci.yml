name: CI

# Das Repo ist privat, Actions-Minuten sind knapp. Die CI läuft deshalb nur auf
# Linux; Windows wird später nachgerüstet. Der master-Lauf füllt zugleich den
# Cargo-Cache, den Pull Requests mitnutzen. Den Release-Build gibt es nur per
# Hand über "Run workflow".
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --profile ci -- -D warnings
      - run: cargo test --workspace --profile ci
      - name: Release-Build (nur per Hand)
        if: github.event_name == 'workflow_dispatch'
        run: cargo build --release -p plx-app
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: prepolix-linux
          path: target/release/prepolix
          if-no-files-found: error
