name: CI

# Das Repo ist privat, Actions-Minuten sind knapp (Windows zählt doppelt).
# Pull Requests und master laufen deshalb nur auf Linux; der master-Lauf füllt
# zugleich den Cargo-Cache, den Pull Requests mitnutzen. Windows und die
# Release-Builds gibt es nur per Hand über "Run workflow".
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --profile ci -- -D warnings
      - run: cargo test --workspace --profile ci
      - name: Release-Build (nur per Hand)
        if: github.event_name == 'workflow_dispatch'
        run: cargo build --release -p plx-app
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: prepolix-${{ runner.os }}
          path: |
            target/release/prepolix
            target/release/prepolix.exe
          if-no-files-found: error
