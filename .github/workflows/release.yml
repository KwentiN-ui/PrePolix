name: Release

# Baut den Windows-Installer auf Linux (MinGW + NSIS), getrennt von der schnellen PR-CI.
# Läuft bei einem Versions-Tag (v0.1.0 usw.) und hängt den Installer an das GitHub-Release,
# oder per Hand über "Run workflow", dann nur als Artefakt.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release
      - uses: actions/cache@v4
        with:
          path: target/gmsh-windows
          key: gmsh-windows-${{ hashFiles('scripts/fetch_gmsh.py') }}
      - name: MinGW und NSIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-mingw-w64-x86-64 nsis
      - run: scripts/build_windows_installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: prepolix-windows-installer
          path: target/windows-installer/prepolix-*-setup.exe
          if-no-files-found: error
      - name: An das Release hängen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" target/windows-installer/prepolix-*-setup.exe --clobber
